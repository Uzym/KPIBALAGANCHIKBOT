services:
  kpibalaganchikbot:
    build: .
    image: kpibalaganchikbot:local
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite + бэкапы живут на хосте, переживают пересборку контейнера
      - ./data:/app/data
    # веб-панель: наружу только на localhost хоста — доступ идёт через nginx
    # (в .env должно быть PANEL_PORT=8080 и PANEL_HOST=0.0.0.0)
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s   # SIGTERM → wal_checkpoint → чистое закрытие
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
